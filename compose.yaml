services:
  muvisual:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muvisual
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./backend/data/visual:/app/backend/data/visual:ro
    environment:
      NODE_ENV: production
      PORT: 8787
      AUTH_PASSWORD: "your-password"
      MODAL_URL: "your-modal-url"
      MODAL_KEY: "your-modal-key"
      MODAL_SECRET: "your-modal-secret"
